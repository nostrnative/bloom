name: Bloom
summary: Hybrid Nostr Relay and Blossom Server.
description: |
  Bloom is a high-performance hybrid server for the Nostr ecosystem.
  It functions as both a Blossom Protocol implementation for media storage
  and a Nostr Relay for event distribution.

  Key features:
  - Decentralized blob storage
  - Integrated Nostr Relay

